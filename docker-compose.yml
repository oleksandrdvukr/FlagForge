# `docker compose up` starts FlagForge with demo credentials (see README).
# Override any value in a `.env` file next to this one; change the secrets before real use.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flagforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagforge}
      POSTGRES_DB: ${POSTGRES_DB:-flagforge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: flagforge:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flagforge}:${POSTGRES_PASSWORD:-flagforge}@postgres:5432/${POSTGRES_DB:-flagforge}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1000}
      JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-change-me-before-real-use}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@flagforge.local}
      # Default = bcrypt hash of "flagforge-demo" ($$ escapes $ in compose files).
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2b$$12$$D1a9YUELlee7lETFaRdGUOQ9.lHXW0jsoXYivSzAkvbWKIKvE4PE6}
      # Secure cookies need HTTPS; localhost is treated as secure by browsers.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  pgdata:
