services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flagforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagforge}
      POSTGRES_DB: ${POSTGRES_DB:-flagforge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # The FlagForge app service is added in phase 8 (see PLAN.md).

volumes:
  pgdata:
