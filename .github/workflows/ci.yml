name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flagforge
          POSTGRES_PASSWORD: flagforge
          POSTGRES_DB: flagforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Tests derive `flagforge_test` from this URL and reset only that database.
      DATABASE_URL: postgresql://flagforge:flagforge@localhost:5432/flagforge
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:api-contract
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    # Catches a broken Dockerfile before release; the image is not pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flagforge:ci .
